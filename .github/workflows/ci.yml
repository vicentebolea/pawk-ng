name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.15 is a pre-release: report failures without blocking the pipeline
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install gawk for the differential tests
        run: sudo apt-get update && sudo apt-get install -y gawk
      - name: Install
        run: python -m pip install pytest .
      - name: Run tests
        run: python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[lint]"
      - name: Ruff
        run: ruff check .

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install gawk for the differential tests
        run: sudo apt-get update && sudo apt-get install -y gawk
      - run: python -m pip install -e ".[test]"
      - name: Tests with coverage (fails under the threshold in pyproject.toml)
        run: python -m pytest --cov=pawk_ng --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml

  publish-testpypi:
    name: Publish dev build to TestPyPI
    # Only a push to main publishes; pull requests never do (and have no
    # access to the publishing identity).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, coverage]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pawk-ng/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Make the version unique for this run
        run: |
          sed -i -E "s/^version = \"([^\"]+)\"/version = \"\1.dev${GITHUB_RUN_NUMBER}\"/" pyproject.toml
          sed -i -E "s/^__version__ = \"([^\"]+)\"/__version__ = \"\1.dev${GITHUB_RUN_NUMBER}\"/" pawk_ng/__init__.py
          grep -n "^version\|^__version__" pyproject.toml pawk_ng/__init__.py

      - name: Build sdist and wheel
        run: python -m pip install build && python -m build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

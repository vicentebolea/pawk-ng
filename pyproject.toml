[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pawk"
version = "0.1.0"
description = "An awk-style stream editor whose pattern/action code is Python 3"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]

[project.scripts]
pawk = "pawk.cli:main"

[tool.setuptools]
packages = ["pawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end tests that spawn the CLI", "contract: behavioural contracts of the awk variables and rules"]

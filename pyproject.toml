[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pawk-ng"
version = "0.1.0"
description = "An awk-style stream editor whose pattern/action code is Python 3"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Environment :: Console",
]

[project.scripts]
pawk = "pawk_ng.cli:main"

[tool.setuptools]
packages = ["pawk_ng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end tests that spawn the CLI", "contract: behavioural contracts of the awk variables and rules"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
lint = ["ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = ["B904", "SIM105", "SIM108", "RUF005", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM117", "RUF012", "RUF001"]

[tool.coverage.run]
source = ["pawk_ng"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
